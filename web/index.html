<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Longtail</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
  h1 { margin: 0 0 4px; }
  .sub { color: #94a3b8; margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; font-size: 16px; border-radius: 6px; border: 1px solid #334155;
          background: #1e293b; color: #e2e8f0; }
  button { padding: 10px 20px; font-size: 16px; border: 0; border-radius: 6px; background: #2563eb;
           color: white; cursor: pointer; }
  button:disabled { background: #475569; cursor: wait; }
  #status { margin: 20px 0; color: #94a3b8; }
  #summary { font-size: 22px; font-weight: 600; margin: 20px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #1e293b; border-radius: 8px; overflow: hidden; }
  .card video { width: 100%; display: block; background: black; aspect-ratio: 16 / 9; }
  .card .body { padding: 12px; }
  .meta { color: #94a3b8; font-size: 13px; margin-bottom: 6px; word-break: break-all; }
  .reason { margin: 0; }
  details { margin-top: 28px; background: #1e293b; border-radius: 8px; padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 600; }
  details li { margin: 10px 0; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
         margin-right: 6px; }
  .tag.no { background: #7f1d1d; } .tag.unsure { background: #78350f; }
  .error { color: #f87171; }
  .log { list-style: none; margin: 0 0 20px; padding: 10px 14px; max-height: 260px; overflow-y: auto;
         background: #020617; border-radius: 8px; font: 13px/1.6 ui-monospace, monospace; }
  .log:empty { display: none; }
  .log .mark { display: inline-block; width: 1.4em; font-weight: 700; }
  .log .yes .mark { color: #4ade80; } .log .rejected .mark { color: #f87171; }
  .log .camera, .log .info { color: #94a3b8; }
  .insight { margin-top: 28px; border: 1px solid #f59e0b; border-radius: 8px; padding: 16px 20px;
             background: #1c1917; }
  .insight h2 { margin: 0 0 8px; font-size: 18px; color: #fbbf24; }
  .insight h3 { margin: 16px 0 6px; font-size: 14px; color: #94a3b8; font-weight: 600; }
  .insight pre { white-space: pre-wrap; margin: 0; padding: 12px; border-radius: 6px; background: #0f172a;
                 font: 14px/1.5 ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Longtail</h1>
  <p class="sub">Describe a scenario. Every camera is searched, then an AI double-checks each clip.</p>
  <form id="form">
    <input id="scenario" value="person close to a moving vehicle" placeholder="e.g. person close to a moving vehicle" required>
    <button id="run" type="submit">Run</button>
  </form>
  <div id="status"></div>
  <ol id="log" class="log"></ol>
  <div id="summary"></div>
  <div id="confirmed" class="grid"></div>
  <div id="insight"></div>
  <div id="rejected"></div>
</main>
<script>
  // Works whether the page is opened as /app/longtail or /app/longtail/.
  const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
  const $ = (id) => document.getElementById(id);

  function esc(text) {
    const div = document.createElement("div");
    div.textContent = text ?? "";
    return div.innerHTML;
  }

  function fmtTime(sec) {
    if (sec == null) return "?";
    const m = Math.floor(sec / 60), s = (sec % 60).toFixed(1).padStart(4, "0");
    return `${String(m).padStart(2, "0")}:${s}`;
  }

  function addCard(jobId, index, h) {
    if (document.querySelector(`#confirmed [data-index="${index}"]`)) return;
    $("confirmed").insertAdjacentHTML("beforeend", `
      <div class="card" data-index="${index}">
        <video src="${base}clip/${jobId}/${index}" controls muted autoplay loop playsinline preload="metadata"></video>
        <div class="body">
          <div class="meta">${esc(h.camera_id)} · ${fmtTime(h.start_sec)} - ${fmtTime(h.end_sec)}<br>${esc(h.video)}</div>
          <p class="reason">${esc(h.reason)}</p>
        </div>
      </div>`);
  }

  function renderProgress(jobId, job) {
    const log = $("log");
    const count = log.children.length;
    for (const e of job.events.slice(count)) {
      const cls = e.kind === "verdict" ? (e.match === "yes" ? "yes" : "rejected") : e.kind;
      const mark = e.kind === "verdict" ? (e.match === "yes" ? "✓" : "✗") : e.kind === "camera" ? "•" : "…";
      log.insertAdjacentHTML("beforeend", `<li class="${cls}"><span class="mark">${mark}</span>${esc(e.text)}</li>`);
      if (e.kind === "verdict" && e.match === "yes") addCard(jobId, e.clip, e.hit);
    }
    if (job.events.length > count) log.scrollTop = log.scrollHeight;
  }

  function render(jobId, job) {
    const hits = job.hits.map((h, i) => ({ ...h, index: i }));
    const confirmed = hits.filter((h) => h.match === "yes");
    const rejected = hits.filter((h) => h.match !== "yes");
    $("summary").textContent = `${hits.length} found -> ${confirmed.length} confirmed`;
    confirmed.forEach((h) => addCard(jobId, h.index, h));

    const insight = job.insight;
    $("insight").innerHTML = insight ? `
      <div class="insight">
        <h2>What your archive can't see</h2>
        <p>${esc(insight.why_search_missed)}</p>
        ${insight.suggested_ingest_prompt ? `
          <h3>Suggested ingest prompt (${insight.suggested_ingest_prompt.length} characters)</h3>
          <pre>${esc(insight.suggested_ingest_prompt)}</pre>` : ""}
      </div>` : "";

    $("rejected").innerHTML = rejected.length ? `
      <details>
        <summary>Rejected clips (${rejected.length})</summary>
        <ul>${rejected.map((h) => `
          <li><span class="tag ${h.match}">${h.match.toUpperCase()}</span>
            <span class="meta">${esc(h.camera_id)} · ${fmtTime(h.start_sec)} - ${fmtTime(h.end_sec)} · ${esc(h.video)}</span><br>
            ${esc(h.reason)}</li>`).join("")}
        </ul>
      </details>` : "";
  }

  async function poll(jobId) {
    while (true) {
      await new Promise((r) => setTimeout(r, 2000));
      const resp = await fetch(`${base}api/jobs/${jobId}`);
      if (!resp.ok) throw new Error(`Status check failed (${resp.status}).`);
      const job = await resp.json();
      renderProgress(jobId, job);
      if (job.status === "done") return job;
      if (job.status === "error") throw new Error(job.error);
    }
  }

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("run").disabled = true;
    $("log").innerHTML = "";
    $("summary").textContent = "";
    $("confirmed").innerHTML = "";
    $("insight").innerHTML = "";
    $("rejected").innerHTML = "";
    $("status").className = "";
    $("status").textContent = "Searching... (about 50 seconds)";
    try {
      const resp = await fetch(`${base}api/run`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scenario: $("scenario").value }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || `Request failed (${resp.status}).`);
      const job = await poll(data.job_id);
      $("status").textContent = "";
      render(data.job_id, job);
    } catch (err) {
      $("status").className = "error";
      $("status").textContent = err.message;
    } finally {
      $("run").disabled = false;
    }
  });
</script>
</body>
</html>
